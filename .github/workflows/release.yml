# Publishes a Kelvo release: tests, a signed Android APK, the Windows (no-Docker) package and checksums.
#
# Start it either way:
#   - GitHub > Actions > Release > Run workflow, version e.g. 0.2.0
#   - git tag v0.2.0 && git push origin v0.2.0
#
# One-time setup (android/RELEASING.md): repository secrets
#   KELVO_KEYSTORE_BASE64    your signing keystore (.jks), base64-encoded
#   KELVO_KEYSTORE_PASSWORD  its password
# Every release must be signed with the same key, or Android refuses to update the installed app.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version
        env:
          RAW: ${{ inputs.version || github.ref_name }}
        run: |
          v="${RAW#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '$RAW')"; exit 1
          fi
          echo "V=$v" >> "$GITHUB_ENV"

      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.KELVO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KELVO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add the repository secrets KELVO_KEYSTORE_BASE64 and KELVO_KEYSTORE_PASSWORD first (see android/RELEASING.md)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        run: |
          python -m pip install --quiet -e "backend[dev]"
          cd backend && python -m pytest -q

      - name: Build the UI
        run: cd frontend && npm ci && npm run build

      - name: Windows package
        run: |
          sed -i "s/^version = \".*\"/version = \"$V\"/" backend/pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" backend/kelvo/__init__.py
          python -m pip wheel --quiet --no-deps ./backend -w dist
          mkdir -p "dist/kelvo-windows-$V"
          cp windows/*.cmd windows/*.ps1 windows/README.txt "dist/kelvo-$V-py3-none-any.whl" "dist/kelvo-windows-$V/"
          (cd dist && zip -qr "kelvo-windows-$V.zip" "kelvo-windows-$V")

      - name: Android build tools (Ubuntu packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner

      - name: Signed APK
        env:
          KS_B64: ${{ secrets.KELVO_KEYSTORE_BASE64 }}
          KELVO_KEYSTORE_PASSWORD: ${{ secrets.KELVO_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          ks="$RUNNER_TEMP/kelvo-release.jks"
          printf '%s' "$KS_B64" | base64 -d > "$ks"
          KELVO_VERSION="$V" KELVO_KEYSTORE="$ks" bash android/build.sh
          rm -f "$ks"
          cp android/build/kelvo.apk "dist/kelvo-$V.apk"

      - name: Checksums and notes
        run: |
          (cd dist && sha256sum "kelvo-$V.apk" "kelvo-windows-$V.zip" > SHA256SUMS.txt)
          bash scripts/release-notes.sh "$V" dist > dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" \
            "dist/kelvo-$V.apk" "dist/kelvo-windows-$V.zip" "dist/SHA256SUMS.txt" \
            --title "Kelvo $V" --notes-file dist/notes.md --target "$GITHUB_SHA"
