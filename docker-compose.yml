# Kelvo + Ollama. GPU users: uncomment the deploy block.
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  kelvo:
    build: .
    depends_on: [ollama]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes: [kelvo:/data]
    ports: ["7860:7860"]
volumes:
  ollama:
  kelvo:
