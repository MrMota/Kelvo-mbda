# Kelvo + Ollama. GPU users: uncomment the deploy block.
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  kelvo:
    build: .
    depends_on: [ollama]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Your account, created on first start. Put these in a .env file next to this one.
      # Leave them unset to use the one-time setup token from `docker compose logs kelvo`.
      KELVO_USERNAME: ${KELVO_USERNAME:-}
      KELVO_PASSWORD: ${KELVO_PASSWORD:-}
    volumes: [kelvo:/data]
    ports: ["7860:7860"]
volumes:
  ollama:
  kelvo:
